[book]
title = "DeepSeek Harness 源码解读"
description = "从 Cordis 插件树到 Agent 主循环：一次关于工程优雅的源码之旅"
authors = ["lxcong"]
language = "zh-CN"
src = "src"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/deepseek-ai/deepseek-harness"
default-theme = "rust"
preferred-dark-theme = "navy"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
